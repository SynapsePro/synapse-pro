<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse Pro - Update Required</title>
    
    <style>
        /* --- CSS VARIABLES --- */
        :root {
            /* Light Mode Defaults */
            --body-bg: #ffffff; 
            
            /* Text */
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            
            /* Card & Buttons */
            --card-bg: #ffffff;
            --card-border: #E5E5EA;
            --button-bg: #0071D3;
            --button-text: #ffffff;
            
            --input-bg: #F2F4F6;
            --border-radius-card: 12px;
        }

        /* --- AUTOMATIC DARK MODE (System Preference) --- */
        @media (prefers-color-scheme: dark) {
            :root {
                --body-bg: #2C2C2C; 
                --text-primary: #e0e0e0;
                --text-secondary: #a0a0a5;
                
                --card-bg: #3a3a3c;
                --card-border: #454545;
                --button-bg: #0071D3;
                
                --input-bg: #1c1c1e; 
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--body-bg);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease;
        }

        /* Hauptbereich */
        #response-output {
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        /* --- INITIAL SCREEN (OUT OF SERVICE) --- */
        .message.initial-message {
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            max-width: 500px;
            padding: 40px 30px;
            
            /* Light Mode Glass */
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: saturate(180%) blur(25px);
            -webkit-backdrop-filter: saturate(180%) blur(25px);
            
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            
            box-shadow: 
                0 15px 35px rgba(0, 113, 211, 0.1), 
                0 5px 15px rgba(0,0,0,0.03);
            
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(211, 47, 47, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(0, 113, 211, 0.05) 0%, transparent 60%);
                
            transition: all 0.3s ease;
        }

        /* Dark Mode Override für Initial Message */
        @media (prefers-color-scheme: dark) {
            .message.initial-message {
                background: rgba(44, 44, 44, 0.75); 
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
                background-image: 
                    radial-gradient(circle at 50% 0%, rgba(0, 113, 211, 0.1) 0%, transparent 70%);
            }
        }

        .initial-message .title { 
            font-size: 2.4em; 
            font-weight: 800; 
            margin-bottom: 16px; 
            letter-spacing: -1px;
            
            background: -webkit-linear-gradient(135deg, #0071D3 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        @media (prefers-color-scheme: dark) {
            .initial-message .title {
                background: -webkit-linear-gradient(135deg, #4facfe 0%, #ffffff 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
        }

        .initial-message .status-badge {
            background-color: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .initial-message .intro-line { 
            font-size: 1.05em; 
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* --- INPUT AREA (DEACTIVATED) --- */
        #input-area {
            padding: 12px 16px;
            background-color: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
            display: flex; gap: 10px; z-index: 100; flex-shrink: 0;
        }
        
        @media (prefers-color-scheme: dark) {
            #input-area { 
                background-color: rgba(44,44,44,0.95); 
                border-top: 1px solid rgba(255,255,255,0.1);
            }
        }

        #user-input {
            flex-grow: 1; padding: 12px 16px; border-radius: 25px;
            border: 1px solid transparent; background-color: var(--input-bg);
            color: var(--text-secondary); font-size: 1rem; outline: none;
            font-family: inherit;
            cursor: not-allowed;
        }

        #send-button {
            width: 45px; height: 45px; border-radius: 50%;
            background-color: var(--text-secondary); color: white; border: none;
            cursor: not-allowed; display: flex; align-items: center; justify-content: center;
            opacity: 0.6;
        }
        #send-button::before { content: '➤'; font-size: 16px; margin-left: 2px; }
        #send-button span { display: none; }

        /* --- FOOTER --- */
        #footer-disclaimer {
            padding: 10px 20px; font-size: 0.75rem; color: var(--text-secondary);
            background-color: var(--body-bg); 
            border-top: 1px solid var(--card-border);
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
    </style>
</head>
<body>

    <main id="response-output">
        <div class="message initial-message">
            <span class="status-badge">Decommissioned</span>
            <h2 class="title">Synapse Pro</h2>
            <p class="intro-line">
                This legacy version of the Synapse Pro interface is no longer supported and has been taken out of service. 
                <br><br>
                To continue enjoying seamless AI assistance within Anki, please update to the latest version of <strong>SynapsePro</strong>.
            </p>
        </div>
    </main>
    
    <div id="input-area">
        <input type="text" id="user-input" placeholder="This version is out of service. Please upgrade." disabled>
        <button id="send-button" disabled><span>Send</span></button>
    </div>

    <footer id="footer-disclaimer">
        <span>Synapse Pro — Connection ended for this version.</span>
    </footer>

    <script>
        // Alle funktionalen Interaktionen wurden deaktiviert.
        document.addEventListener("DOMContentLoaded", () => {
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            
            if (userInput) userInput.disabled = true;
            if (sendButton) sendButton.disabled = true;
        });
    </script>
</body>
</html>
